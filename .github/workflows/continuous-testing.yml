name: Continuous Testing Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: learnerspoint_test
          POSTGRES_USER: bhavik
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Prisma Database Schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://bhavik:password123@localhost:5432/learnerspoint_test?schema=public

      - name: Push Schema Updates to Test DB
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://bhavik:password123@localhost:5432/learnerspoint_test?schema=public

      - name: Run Jest Test Suites
        run: npm run test
        env:
          DATABASE_URL: postgresql://bhavik:password123@localhost:5432/learnerspoint_test?schema=public
          JWT_SECRET: super-secret-key-change-me-in-production-123456789
          RAZORPAY_KEY_ID: rzp_test_mockKey12345
          RAZORPAY_KEY_SECRET: mockSecretXYZ12345

      - name: Test Production Server Compilation Build
        run: npm run build:web
        env:
          DATABASE_URL: postgresql://bhavik:password123@localhost:5432/learnerspoint_test?schema=public
          JWT_SECRET: super-secret-key-change-me-in-production-123456789
          RAZORPAY_KEY_ID: rzp_test_mockKey12345
          RAZORPAY_KEY_SECRET: mockSecretXYZ12345

      - name: Verify Docker Compose Config
        run: docker compose config

      - name: Docker Compose Build Dry-Run
        run: docker compose build
